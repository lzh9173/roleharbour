<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RoleHarbour banner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
      }
      .banner {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: #f7f8fa;
        font-family: Inter, sans-serif;
        color: #051a49;
      }
      .halo {
        position: absolute;
        left: 742px;
        top: 70px;
        width: 520px;
        height: 520px;
        border-radius: 50%;
        background: #cfe8ff;
      }
      .haru {
        position: absolute;
        left: 880px;
        bottom: 0;
        height: 612px;
      }
      .brand {
        position: absolute;
        left: 88px;
        top: 88px;
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 40px;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .brand img {
        width: 54px;
        height: 54px;
      }
      h1 {
        position: absolute;
        left: 84px;
        top: 186px;
        margin: 0;
        font-size: 92px;
        font-weight: 900;
        line-height: 0.98;
        letter-spacing: -0.045em;
      }
      .mark {
        background: linear-gradient(transparent 52%, #f5b841 52%, #f5b841 92%, transparent 92%);
        padding: 0 6px;
        margin: 0 -6px;
      }
      .sub {
        position: absolute;
        left: 88px;
        top: 398px;
        margin: 0;
        font-size: 26px;
        color: #5a6881;
      }
      .pills {
        position: absolute;
        left: 88px;
        top: 462px;
        width: 680px;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      .pills span {
        border: 1.5px solid #e4e8ed;
        background: #fff;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 18px;
        font-weight: 600;
        color: #2e3849;
      }
      .fine {
        position: absolute;
        left: 88px;
        bottom: 34px;
        margin: 0;
        font-size: 15px;
        color: #8995a9;
      }
    </style>
  </head>
  <body>
    <div class="banner" id="banner">
      <div class="halo"></div>
      <img class="haru" src="haru/full-front.png" alt="" />
      <div class="brand"><img src="logo/crest.svg" alt="" />RoleHarbour</div>
      <h1>Job ads,<br /><span class="mark">read for you.</span></h1>
      <p class="sub">On-device job research for SEEK New Zealand.</p>
      <div class="pills">
        <span>Preparation checklist</span><span>Visa wording, with sources</span
        ><span>Accredited employer list</span><span>No uploads</span>
      </div>
      <p class="fine">Chrome extension · Independent of SEEK and INZ.</p>
    </div>
    <script src="/promo/lib/fonts.js"></script>
  </body>
</html>
