<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RoleHarbour lockup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=block"
    />
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
      }
      .lockup {
        display: inline-flex;
        align-items: center;
        gap: 22px;
        padding: 12px 20px 12px 8px;
        font:
          800 96px/1 Inter,
          sans-serif;
        letter-spacing: -0.02em;
        color: #051a49;
      }
      .lockup img {
        width: 118px;
        height: 118px;
      }
    </style>
  </head>
  <body>
    <div class="lockup" id="lockup">
      <img src="crest.svg" alt="" />
      <span>RoleHarbour</span>
    </div>
    <script src="/promo/lib/fonts.js"></script>
  </body>
</html>
